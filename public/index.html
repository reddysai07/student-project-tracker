<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Project Tracker</title>

    <style>
        /* Global styles */
        * {
            box-sizing: border-box;
        }

        :root {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            color: #1f2937;
            background-color: #f3f5f9;
            line-height: 1.6;
        }

        body {
            margin: 0;
            min-width: 320px;
        }

        /* Page layout */
        header {
            padding: 32px 20px;
            color: #ffffff;
            background-color: #17365d;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            line-height: 1.2;
        }

        header p {
            max-width: 700px;
            margin: 0;
            color: #e2eaf5;
        }

        main {
            width: min(100% - 40px, 900px);
            margin: 32px auto;
        }

        section {
            margin-bottom: 24px;
            padding: 24px;
            background-color: #ffffff;
            border: 1px solid #d8dee8;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgb(15 23 42 / 6%);
        }

        h2 {
            margin: 0 0 20px;
            color: #17365d;
            font-size: 1.4rem;
        }

        /* Form controls */
        #project-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #project-form > div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            color: #263449;
        }

        input,
        select {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            font: inherit;
            color: #1f2937;
            background-color: #ffffff;
            border: 1px solid #8a96a8;
            border-radius: 6px;
        }

        input:hover,
        select:hover {
            border-color: #365f91;
        }

        input:focus-visible,
        select:focus-visible,
        button:focus-visible {
            outline: 3px solid #1769c2;
            outline-offset: 3px;
        }

        input:focus-visible,
        select:focus-visible {
            border-color: #1769c2;
        }

        /* Buttons */
        button {
            min-height: 44px;
            padding: 10px 18px;
            font: inherit;
            font-weight: 600;
            color: #ffffff;
            background-color: #174f8a;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #103b69;
        }

        button:active {
            transform: translateY(1px);
        }

        #project-form button {
            align-self: flex-start;
        }

        #cancel-button {
            color: #263449;
            background-color: #e8edf4;
            border-color: #aab5c5;
        }

        #cancel-button:hover {
            background-color: #d9e1ec;
        }

        [hidden] {
            display: none !important;
        }

        /* Flex layout for project card actions */
        .card-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        /* Messages and project list */
        #message {
            margin: 16px 0 0;
            overflow-wrap: anywhere;
        }

        #empty-state {
            margin: 0;
            color: #526176;
        }

        #project-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
        }

        #project-list > li {
            padding: 16px;
            background-color: #f8fafc;
            border: 1px solid #d8dee8;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        /* Responsive layout */
        @media (max-width: 560px) {
            header {
                padding: 24px 16px;
            }

            main {
                width: calc(100% - 24px);
                margin: 20px auto;
            }

            section {
                padding: 18px;
                border-radius: 8px;
            }

            h2 {
                font-size: 1.2rem;
            }

            #project-form button {
                width: 100%;
                align-self: stretch;
            }

            .card-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .card-actions button {
                width: 100%;
            }
        }
    </style>

    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Student Project Tracker</h1>
        <p>Track our electronics project ideas.</p>
    </header>

    <main>
        <section aria-labelledby="form-title">
            <h2 id="form-title">Add or Edit Project</h2>

            <form id="project-form">
                <div>
                    <label for="name">Project Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        maxlength="80"
                    >
                </div>

                <div>
                    <label for="status">Project Status</label>
                    <select id="status" name="status">
                        <option value="Planned">Planned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <button id="save-button" type="submit">Save Project</button>
                <button id="cancel-button" type="button" hidden>Cancel</button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section aria-labelledby="list-title">
            <h2 id="list-title">Project List</h2>

            <p id="empty-state">No projects to display yet.</p>

            <ul id="project-list"></ul>
        </section>
    </main>
</body>
</html>
